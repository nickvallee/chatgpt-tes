<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; padding: 0 1rem; color: #111; }
      a { color: #1f6feb; text-decoration: none; }
      a:hover { text-decoration: underline; }
      header { margin-bottom: 2rem; }
      p { margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ url_for('index') }}">&larr; Back to list</a>
      <h1>{{ title }}</h1>
    </header>
    {% for paragraph in paragraphs %}
    <p>{{ paragraph }}</p>
    {% else %}
    <p>Nothing to show for this article.</p>
    {% endfor %}
  </body>
</html>
